# controllers.yaml  -- Configurare ros2_control pentru robotul de recuperare (6 GDL).
# Plasati in:  rehab_exo_description/config/controllers.yaml
# Referit din plugin-ul gz_ros2_control din URDF.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controller de pozitie pe traiectorie pentru toate cele 6 articulatii.
    leg_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # v3: controller de pozitie pentru axele de ajustare (prismatice).
    adjust_position_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

leg_trajectory_controller:
  ros__parameters:
    joints:
      - left_hip_joint
      - left_knee_joint
      - left_ankle_joint
      - right_hip_joint
      - right_knee_joint
      - right_ankle_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # La activare, interfata de comanda a simulatorului poate contine inca 0.0,
    # desi encoderele arata postura initiala (de ex. genunchi ~pi/2). Implicitul
    # Jazzy foloseste ultima comanda ca stare si produce astfel un salt artificial
    # spre zero. Initializam explicit din starea masurata.
    set_last_command_interface_value_as_state_on_activation: false
    # Toleranta de urmarire DEZACTIVATA (0.0): in fizica reala, eroarea
    # tranzitorie depaseste usor cativa sutimi de radian, iar o toleranta
    # stransa face JTC sa ABORTEZE traiectoria imediat (simptom: robotul
    # "misca putin apoi se opreste"). Pe hardware real, siguranta vine din
    # limitarea de cuplu + oprirea de urgenta, nu din abort de traiectorie.
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

adjust_position_controller:
  ros__parameters:
    joints:
      - seat_lift_joint
      - left_thigh_ext_joint
      - right_thigh_ext_joint
      - left_shank_ext_joint
      - right_shank_ext_joint

# Nodul plugin-ului gz_ros2_control. MASURAT pe 21 aug 2026 cu 'ros2 param get':
# position_proportional_gain traieste AICI, pe /gz_ros_control (implicit 0.1), NU pe
# /controller_manager si NU in URDF sub <hardware>. Puse in celelalte doua locuri,
# valorile se accepta fara eroare si nu fac nimic.
#
# CASTIGUL 1.0, ales prin masurare pe 22 aug 2026, NU prin acordare din ochi.
# La 15.0 gleznele intrau in oscilatie la frecventa buclei: schimbare de semn la
# FIECARE esantion (557 din 558) si viteza fixata pe limita nominala in 553 din 558.
# Contra-intuitiv, castigul MAI MIC urmareste MAI BINE, si motivul e ca articulatia
# e comandata CINEMATIC: gz_ros2_control scrie JointVelocityCmd = k * eroare, iar
# Gazebo o aplica drept constrangere de viteza, nu drept cuplu. Nu exista nimic de
# invins, deci castigul mare doar suprareactioneaza.
#   castig 15.0 : oscilatie violenta; eroare de urmarire in regim 0.023 rad
#   castig  1.0 : zero oscilatie; treapta de 0.30 rad urmarita si asezata la 0.000
# Consecinta de stiut: cu comanda cinematica NU exista rejectie de perturbatie. Cand
# modelul de pacient va aplica forte reale, trebuie comanda in EFORT, si atunci
# castigul asta devine irelevant si se reia acordarea.
gz_ros_control:
  ros__parameters:
    position_proportional_gain: 1.0
    hold_joints: false
