    How accurately, with what delay and energy error, does one rigidly coupled
    A/B pair physically render a requested virtual damping load over a
    predeclared safe experimental domain?
  model_equation: "tau_d(t) = D_v * q_dot(t)"
  primary_requested_signal: "tau_B_requested_after_sign_and_limits"
  primary_observed_signal: "tau_port_sensor"

