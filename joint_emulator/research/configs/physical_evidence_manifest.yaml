schema_version: "1.0.0"
artifact: "TASK-008 ViPRO physical evidence manifest"
manifest_state: "EMPTY_INSPECTION_TEMPLATE"

status_vocabulary:
  - "CONFIRMED"
  - "UNKNOWN"
  - "NOT_PRESENT"
  - "NOT_APPLICABLE"

status_rules:
  CONFIRMED: >-
    value is non-null and evidence contains at least one applicable original
    observation/document/export with locator, capture metadata and SHA-256.
  UNKNOWN: >-
    value is null, provenance is UNKNOWN, and notes/next_action explain what
    evidence is missing, ambiguous, inaccessible or conflicting.
  NOT_PRESENT: >-
    evidence establishes absence within a clearly recorded inspection scope;
    absence is never inferred from one unreadable or missing label.
  NOT_APPLICABLE: >-
    justification and evidence establish that the item does not apply to the
    verified architecture.

evidence_record_contract:
  required_fields:
    - "evidence_id"
    - "kind"
    - "uri"
    - "sha256"
    - "capture_utc"
    - "captured_by"
    - "physical_location"
    - "locator"
    - "is_original"
    - "notes"
  allowed_kinds:
    - "PHOTO"
    - "VIDEO"
    - "NAMEPLATE_TRANSCRIPTION"
    - "MANUAL"
    - "SCHEMATIC"
    - "PARAMETER_EXPORT"
    - "ENGINEERING_PROJECT_EXPORT"
    - "CALIBRATION_CERTIFICATE"
    - "AUTHORIZED_STATEMENT"
    - "READ_ONLY_MEASUREMENT"

