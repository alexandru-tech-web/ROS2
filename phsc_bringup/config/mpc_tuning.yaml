# mpc_tuning.yaml
# Parametri de tuning pentru MPC Controller Node

mpc_controller_node:
  ros__parameters:
    # Orizont de predictie
    N: 20
    dt: 0.05          # [s] - pas MPC (20 Hz)

    # Constrangeri
    u_max: 100.0      # [N] - limita forta control
    theta_max: 0.5    # [rad] - limita unghi pendul (~28 grade)

    # Delay
    tau_est: 0.08     # [s] - latenta estimata medie
    tau_var: 0.02     # [s] - variatie latenta

    # Matrici de cost MPC
    Q_diag: [10.0, 1.0, 100.0, 1.0]   # [p, p_dot, theta, theta_dot]
    R: 0.01                            # penalizare control (mic = agresiv)
    R_du: 0.5                          # penalizare variatie control (Delta-u)
    P_diag: [50.0, 5.0, 500.0, 5.0]   # cost terminal
    # ATENTIE tuning: R_du=0.5 este de 50x mai mare decat R=0.01, deci costul
    # dominant NU e efortul de control, ci netezimea lui. Inainte R_du nu era
    # expus si lua default-ul 0.5 fara ca nimeni sa o observe.

    # Parametri solver
    max_iter: 200
    ftol: 1.0e-6
